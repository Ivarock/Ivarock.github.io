<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌎</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {% seo %}
</head>
<body>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__brand" href="{{ '/' | relative_url }}">
        <span class="site-header__mark">🌎</span>
        <span class="site-header__title">{{ site.title }}</span>
      </a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Inicio</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/fotografia/' | relative_url }}">Fotografía</a>
        <a href="{{ '/medicina/' | relative_url }}">Medicina</a>
        <a href="{{ '/acerca-de/' | relative_url }}">Acerca de</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>© {{ site.time | date: '%Y' }} {{ site.author }}. Hecho con Jekyll + GitHub Pages. · <a href="{{ '/feed.xml' | relative_url }}">RSS</a></p>
    </div>
  </footer>

</body>
</html>
